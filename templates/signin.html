<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Sign In</title>
</head>
<body style="background-color: #F8FAFC; color: #0F172A;">
    <h1 style="text-align: center; padding-top: 4vh; font-size: 3.5vw;">Register here</h1>
    <form action="/signin" method="post">
        <p style="font-size: 3vh;"><b>Username:</b> <br> <input type="text" name="name" placeholder="enter your username" required>
        <br><br>
        <b>Pin:</b> <br> <input type="text" inputmode="numeric" pattern="[0-9]{4}" name="pin" placeholder="Enter a 4 digit pin" required></p>
        <button type="submit">Sign Up</button>
    </form>
</body>
